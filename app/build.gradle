plugins {
    id 'com.android.application'
}

android {
    namespace 'com.github.mobile.gauges'
    compileSdk 34

    defaultConfig {
        applicationId 'com.github.mobile.gauges'
        minSdk 21
        targetSdk 23
        versionCode 150
        versionName '1.5'
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src/main/java']
            res.srcDirs = ['res']
        }
        test {
            java.srcDirs = ['src/test/java']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }

    packaging {
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/DEPENDENCIES']
        }
    }
}

dependencies {
    implementation project(':libraries:wishlist')
    implementation project(':libraries:viewpagerindicator')

    implementation 'com.android.support:support-v4:18.0.0'
    implementation project(':libraries:actionbarsherlock')
    implementation 'com.github.rtyley:roboguice-sherlock:1.4'
    implementation 'org.roboguice:roboguice:2.0'
    implementation 'com.google.code.gson:gson:2.2.3'
    implementation 'com.github.kevinsawicki:http-request:4.2'
    implementation 'com.nineoldandroids:library:2.2.0'
    implementation 'com.github.kevinsawicki:android-pusher:0.6'

    testImplementation 'junit:junit:4.10'
    testImplementation 'org.hamcrest:hamcrest-library:1.3.RC2'
    testImplementation 'org.mockito:mockito-core:4.11.0'
}
